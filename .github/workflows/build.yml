name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A937CF: ${{ secrets.A937CF }}
          BD0D6A: ${{ secrets.BD0D6A }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A937CF', '')
          k2 = os.environ.get('BD0D6A', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 25c5632e1babe3d43f5ef207077925be88c36b195ceec3 -->', k1) if k1 else txt
          out = out.replace('<!-- 212895787e72c249cc36e57ed682b8c29f2e77c21d56 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
