<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#820ad1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nubank</title>
<style>
:root{
  --nu:#820ad1;
  --nu-dark:#5c0a94;
  --nu-light:#a54de0;
  --bg:#0b0b0f;
  --pl:#1a1a1e;
  --pl2:#23232a;
  --mut:#a3a3ad;
  --brd:#26262d;
  --grn:#36c98f;
  --red:#ff6b78;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%;overflow-x:hidden}
body{
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(90px + var(--safe));
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{outline:none}
img,svg{display:block;max-width:100%}

/* ============ SPLASH SCREEN ============ */
#splash{
  position:fixed;
  inset:0;
  background:var(--nu);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .6s ease,visibility .6s ease;
}
#splash.out{opacity:0;visibility:hidden}
#splash svg{
  width:100px;
  color:#fff;
  animation:logoPop .8s cubic-bezier(.34,1.56,.64,1);
}
@keyframes logoPop{
  0%{opacity:0;transform:scale(.5)}
  60%{transform:scale(1.08)}
  100%{opacity:1;transform:scale(1)}
}

/* ============ ANIMAÇÕES GERAIS ============ */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes slideDown{
  from{opacity:0;transform:translate(-50%,-16px)}
  to{opacity:1;transform:translate(-50%,0)}
}
@keyframes pop{
  0%{transform:scale(0);opacity:0}
  60%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}
@keyframes ripple{
  to{transform:scale(2.5);opacity:0}
}
.fade-up{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
.d-1{animation-delay:.05s}
.d-2{animation-delay:.1s}
.d-3{animation-delay:.15s}
.d-4{animation-delay:.2s}
.d-5{animation-delay:.25s}
.d-6{animation-delay:.3s}

/* ============ HEADER ============ */
.hd{
  background:linear-gradient(180deg,var(--nu) 0%,#6a08ac 100%);
  padding:16px 18px 24px;
  position:sticky;
  top:0;
  z-index:20;
  animation:fadeIn .5s ease;
}
.hr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hl{display:flex;align-items:center;gap:14px}
.av{
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease,background .15s ease;
  cursor:pointer;
}
.av:active{transform:scale(.92);background:rgba(255,255,255,.28)}
.av svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8}
.nu-logo{width:52px;height:30px;color:#fff}
.hi{display:flex;gap:16px;align-items:center}
.hi button{
  color:#fff;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease,opacity .15s ease;
}
.hi button:active{transform:scale(.85);opacity:.7}
.hi svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gr{color:#fff;font-size:16px;margin:18px 0 0;font-weight:500;animation:fadeUp .5s .1s both}

/* ============ MAIN ============ */
main{max-width:820px;margin:auto;position:relative}

/* ============ SALDO ============ */
.sb{padding:22px 18px 8px;animation:fadeUp .5s .15s both}
.sbl{font-size:15px;color:#fff;display:flex;align-items:center;gap:8px}
.sbl-arrow{opacity:.5;font-size:20px}
.saldo{
  font-size:28px;font-weight:700;margin:8px 0 0;
  cursor:pointer;transition:color .15s ease,transform .12s ease;
  letter-spacing:-.5px;
  display:inline-block;
}
.saldo:hover{color:var(--nu-light)}
.saldo:active{transform:scale(.96)}
.sal-hint{font-size:11px;color:#7a7a82;margin-top:4px;opacity:.8}
.vincular{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--pl);border:1px solid #2a2a32;
  border-radius:20px;padding:9px 14px;
  font-size:13px;font-weight:600;margin-top:14px;
  cursor:pointer;transition:background .15s ease,transform .1s ease;
}
.vincular:active{background:#23232a;transform:scale(.97)}
.vincular svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}

/* ============ QUICK ACTIONS ============ */
.qk{
  display:flex;gap:4px;overflow-x:auto;
  padding:22px 12px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  animation:fadeUp .5s .2s both;
}
.qk::-webkit-scrollbar{display:none}
.qk button{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  min-width:84px;flex-shrink:0;
  transition:transform .12s ease;
}
.qk button:active{transform:scale(.94)}
.qk .c{
  width:68px;height:68px;border-radius:50%;
  background:var(--pl);
  display:grid;place-items:center;
  position:relative;
  transition:background .15s ease;
}
.qk button:active .c{background:#23232a}
.qk .c svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qk .badge{
  position:absolute;bottom:-4px;
  background:var(--nu);color:#fff;
  font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:5px;
  letter-spacing:.5px;
  box-shadow:0 2px 8px rgba(130,10,209,.5);
}
.qk span:last-child{font-size:11.5px;color:#fff;text-align:center;line-height:1.2;font-weight:500}

/* ============ PILL CARD ============ */
.pl{
  display:flex;align-items:center;gap:14px;
  background:var(--pl);border-radius:16px;
  padding:18px;margin:10px 16px;
  cursor:pointer;
  transition:background .15s ease,transform .12s ease;
  animation:fadeUp .5s .25s both;
}
.pl:active{background:#23232a;transform:scale(.98)}
.pl svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;flex-shrink:0;stroke-linecap:round;stroke-linejoin:round}
.pl .t{flex:1;font-size:15px;font-weight:600}
.pl .arrow{opacity:.4;font-size:20px;margin-left:auto}

/* ============ BANNER NUBANK VIDA ============ */
.banner-vida{
  background:linear-gradient(135deg,#4a1a78 0%,#2b0a45 100%);
  border:1px solid #5c2490;
  border-radius:18px;padding:20px 22px;
  margin:14px 16px;
  display:flex;align-items:center;gap:16px;
  cursor:pointer;
  position:relative;overflow:hidden;
  animation:fadeUp .5s .3s both;
}
.banner-vida::after{
  content:"";position:absolute;right:-30px;top:-30px;
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(165,77,224,.35),transparent 70%);
}
.banner-vida .txt{
  flex:1;font-size:14px;color:#fff;line-height:1.45;
  position:relative;z-index:1;font-weight:500;
}
.banner-vida .txt b{font-weight:800}
.banner-vida .lock{
  width:44px;height:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;
}
.banner-vida .lock svg{width:34px;height:34px;stroke:#c98eff;fill:none;stroke-width:2}

/* ============ CARTÃO DE CRÉDITO ============ */
.cc-section{margin:22px 16px 12px;animation:fadeUp .5s .35s both}
.cc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.cc-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.cc-header .sub{font-size:12px;color:var(--mut)}
.cc-fatura{
  background:var(--pl);border-radius:16px;padding:18px 20px;
  display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;
}
.cc-fatura .lbl{font-size:12px;color:var(--mut);margin-bottom:4px}
.cc-fatura .val{font-size:18px;font-weight:700}
.cc-fatura .r{text-align:right}
.cc-fatura .r .lbl{color:var(--mut)}
.cc-fatura .r .val{color:#fff}
.cc-progress{
  height:6px;background:#2a2a30;border-radius:3px;
  overflow:hidden;margin-top:14px;
  position:relative;
}
.cc-progress-bar{
  height:100%;background:linear-gradient(90deg,var(--nu),var(--nu-light));
  border-radius:3px;width:0%;
  transition:width .8s cubic-bezier(.2,.8,.2,1);
}

/* ============ SEÇÃO TÍTULO ============ */
.st{
  font-size:16px;font-weight:700;
  margin:24px 18px 10px;
  padding-top:14px;
  border-top:1px solid var(--brd);
}

/* ============ VIEWS ============ */
.v{display:none}
.v.a{display:block;animation:fadeIn .3s ease}
h1{font-size:22px;margin:20px 18px 12px;font-weight:700;letter-spacing:-.3px}

/* ============ FORM ============ */
.f{margin-bottom:14px}
.f label{
  display:block;font-size:13px;font-weight:600;
  color:#d5d5dc;margin-bottom:7px;
}
.f input,.f textarea,.f select{
  width:100%;background:#151519;
  border:1.5px solid #2f2f38;border-radius:12px;
  padding:14px;font-size:15px;
  transition:border-color .15s ease,background .15s ease;
}
.f input:focus,.f textarea:focus,.f select:focus{
  border-color:var(--nu);background:#17171c;
}
.f input::placeholder,.f textarea::placeholder{color:#6d6d78}
.f textarea{min-height:80px;resize:vertical;font-family:inherit}
.form{padding:0 16px}

/* ============ BOTÕES ============ */
.btn{
  background:var(--nu);color:#fff;
  border-radius:14px;padding:15px;
  font-weight:700;width:100%;font-size:15px;
  margin-top:10px;cursor:pointer;
  transition:background .15s ease,transform .1s ease;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{background:var(--nu-dark)}
.btn:active{transform:scale(.98)}
.btn.s{background:#26262d}
.btn.s:hover{background:#2f2f38}
.btn.r{background:#3a1a22;color:#ffb3bd}
.btn.r:hover{background:#4a1a22}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

/* ============ TRANSAÇÕES ============ */
.tx{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  border-bottom:1px solid var(--brd);
  animation:fadeUp .4s both;
}
.tx .i{flex:1;min-width:0}
.tx .ti{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .su{font-size:12px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .vl{font-weight:700;white-space:nowrap;font-size:14px}
.tx .vl.in{color:var(--grn)}
.tx .vb{
  font-size:11.5px;color:#c98eff;font-weight:600;
  cursor:pointer;margin-top:6px;display:inline-block;
  transition:opacity .15s ease;
}
.tx .vb:active{opacity:.6}
.tx-icon{
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;flex-shrink:0;
  background:#1f1f25;
}
.tx-icon.in{background:#153a2c;color:var(--grn)}
.tx-icon.out{background:#3a1a22;color:var(--red)}
.tx-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.em{padding:32px 18px;color:var(--mut);text-align:center;font-size:13.5px;line-height:1.6}

/* ============ MENU ============ */
.mi{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;border-bottom:1px solid var(--brd);
  cursor:pointer;transition:background .15s ease;
}
.mi:active{background:#17171c}
.mi .ic{
  width:40px;height:40px;border-radius:50%;
  background:#1f1f25;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.mi .ic svg{width:20px;height:20px;stroke:#c98eff;fill:none;stroke-width:1.8}
.mi .t{flex:1;font-size:15px;font-weight:500}
.mi .arrow{opacity:.4;font-size:20px}

/* ============ NAV ============ */
nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(11,11,15,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--brd);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:10px 6px calc(14px + var(--safe));
  z-index:30;
}
nav button{
  color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10.5px;font-weight:600;
  padding:4px 0;
  transition:color .15s ease,transform .12s ease;
  position:relative;
}
nav button:active{transform:scale(.9)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff}
nav button.on::before{
  content:"";position:absolute;top:-4px;left:50%;
  transform:translateX(-50%);
  width:20px;height:3px;border-radius:2px;
  background:var(--nu);
}

/* ============ CARTÃO VIRTUAL ============ */
.credit-card{
  border-radius:20px;padding:24px;
  min-height:200px;
  background:linear-gradient(135deg,#820ad1 0%,#51118e 60%,#28133e 100%);
  margin:16px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
  box-shadow:0 20px 50px rgba(130,10,209,.35);
  animation:fadeUp .5s both;
}
.credit-card::after{
  content:"";position:absolute;right:-50px;bottom:-50px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);
}
.credit-card::before{
  content:"";position:absolute;left:-40px;top:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);
}
.credit-card .tp{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.credit-card .br{color:#fff;font-weight:900;font-size:22px;letter-spacing:-1.5px;line-height:1}
.credit-card .ch{
  width:38px;height:28px;border-radius:6px;
  background:linear-gradient(135deg,#e8d8a4,#a88c55);
  border:1px solid #f2d9a0;position:relative;
}
.credit-card .ch::before,.credit-card .ch::after{content:"";position:absolute;border:1px solid #8f7544}
.credit-card .ch::before{inset:8px 0;border-left:0;border-right:0}
.credit-card .ch::after{inset:0 11px;border-top:0;border-bottom:0}
.credit-card .nm{
  font-size:19px;letter-spacing:3px;font-weight:600;
  margin:22px 0;position:relative;z-index:1;
  font-variant-numeric:tabular-nums;
}
.credit-card .bt{
  display:flex;justify-content:space-between;
  font-size:11px;color:#e0c8ff;text-transform:uppercase;
  letter-spacing:.5px;position:relative;z-index:1;
}
.credit-card .bt b{display:block;color:#fff;font-size:13px;margin-top:4px;font-weight:700}

/* ============ MODAL SALDO ============ */
.sm{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:80;display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.sm.on{display:flex;animation:fadeIn .25s ease}
.smc{
  background:#1a1a1e;border-radius:24px 24px 0 0;
  padding:26px 22px calc(26px + var(--safe));
  max-width:500px;width:100%;
  animation:slideUpSheet .35s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUpSheet{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}
.smc h3{font-size:19px;font-weight:800;margin-bottom:6px;color:#fff}
.smc .sub{font-size:13px;color:var(--mut);margin-bottom:20px}
.smc input{
  width:100%;background:#0b0b0f;
  border:1.5px solid #2f2f38;border-radius:14px;
  padding:18px;font-size:26px;font-weight:700;
  text-align:center;color:#fff;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums;
  transition:border-color .15s ease;
}
.smc input:focus{border-color:var(--nu)}
.smc .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.smc .btns button{border-radius:14px;padding:15px;font-weight:700;font-size:14px;cursor:pointer;border:0;transition:transform .1s ease,background .15s ease}
.smc .btns button:active{transform:scale(.97)}
.smc .btns .cancel{background:#26262d;color:#fff}
.smc .btns .ok{background:var(--nu);color:#fff}

/* ============ CAIXINHAS ============ */
.cx-hero{
  background:linear-gradient(135deg,#820ad1 0%,#51118e 60%,#28133e 100%);
  border-radius:22px;padding:26px 22px;
  margin:14px 16px;position:relative;overflow:hidden;
  box-shadow:0 15px 45px rgba(130,10,209,.35);
}
.cx-hero::after{
  content:"";position:absolute;right:-40px;top:-40px;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);
}
.cx-hero::before{
  content:"";position:absolute;left:-30px;bottom:-50px;
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);
}
.cx-hero .lbl{
  font-size:12px;color:#dcc4ff;text-transform:uppercase;
  letter-spacing:1px;font-weight:600;position:relative;z-index:1;
}
.cx-hero .val{
  font-size:36px;font-weight:800;letter-spacing:-1px;
  margin:10px 0 6px;position:relative;z-index:1;
  font-variant-numeric:tabular-nums;
}
.cx-hero .foot{font-size:12px;color:#c4a8e8;position:relative;z-index:1}
.cx-list{padding:0 16px}
.cx-item{
  display:flex;align-items:center;gap:14px;
  background:var(--pl);border-radius:16px;
  padding:18px;margin:10px 0;cursor:pointer;
  transition:transform .12s ease,background .15s ease;
  border:1px solid var(--brd);
}
.cx-item:active{transform:scale(.98);background:#23232a}
.cx-icon{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;flex-shrink:0;color:#fff;
}
.cx-info{flex:1;min-width:0}
.cx-name{font-size:15px;font-weight:700;color:#fff}
.cx-desc{font-size:12px;color:var(--mut);margin-top:3px}
.cx-right{text-align:right}
.cx-rate{font-size:12px;color:var(--grn);font-weight:700}
.cx-value{font-size:14px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

/* ============ COMPROVANTE ============ */
.rm{
  position:fixed;inset:0;background:#fff;color:#111;
  z-index:60;overflow-y:auto;display:none;
}
.rm.on{display:block;animation:fadeIn .3s ease}
.rc{
  max-width:600px;margin:auto;
  padding:24px 22px 60px;
  font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
}
.rc .bk{
  background:#f0f0f2;border-radius:10px;
  padding:10px 16px;font-size:13px;font-weight:600;
  margin-bottom:26px;cursor:pointer;color:#333;
  transition:background .15s ease;
  display:inline-block;
}
.rc .bk:active{background:#e4e4e8}
.rc .lg{
  color:var(--nu);font-size:36px;font-weight:900;
  letter-spacing:-2.5px;margin-bottom:18px;
  line-height:1;
}
.rc h2{
  font-size:26px;font-weight:800;margin:0 0 6px;
  color:#111;letter-spacing:-.5px;line-height:1.2;
}
.rc .dt{
  font-size:13px;color:#999;text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:32px;font-weight:500;
}
.rc .row{
  display:flex;justify-content:space-between;
  padding:16px 0;font-size:15px;
  border-bottom:1px solid #f0f0f2;
}
.rc .row:last-child{border-bottom:0}
.rc .row .l{color:#111;font-weight:600}
.rc .row .v{color:#666;text-align:right;max-width:60%;word-break:break-word;font-weight:500}
.rc .box{
  background:#f5f5f7;border-radius:12px;
  padding:22px;margin-top:28px;
  font-size:13px;line-height:1.65;color:#444;
}
.rc .box b{color:#111;display:block;font-weight:700;margin-bottom:3px}
.rc .box .cj{display:block;overflow:hidden;white-space:nowrap;width:190px;color:#444}
.rc .box .mt{display:block;margin-top:18px;color:#444}

</div><script>
'use strict';

/* ============ ESTADO ============ */
var K = 'nbk_v11';
var INITIAL = {
  saldo: 1250,
  txs: [],
  nome: 'Pessoa Usuária',
  meuCpf: '',
  cardN: null,
  cardE: null,
  inv1: 0,
  inv2: 0,
  fgts: 3480,
  fatura: 0,
  lastRend: null
};

var S = carregar();
var vis = true;
var tmr;

function carregar(){
  try{
    var r = localStorage.getItem(K);
    if(r){
      var s = JSON.parse(r);
      if(s && typeof s.saldo === 'number' && Array.isArray(s.txs)){
        for(var k in INITIAL){
          if(!(k in s)) s[k] = Array.isArray(INITIAL[k]) ? [] : INITIAL[k];
        }
        return s;
      }
    }
  }catch(e){}
  var c = {};
  for(var kk in INITIAL) c[kk] = Array.isArray(INITIAL[kk]) ? [] : INITIAL[kk];
  return c;
}
function salvar(){
  try{ localStorage.setItem(K, JSON.stringify(S)); }catch(e){}
}
function $id(i){ return document.getElementById(i); }
function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(v){
  return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function tst(m, e){
  var el = $id('tst');
  if(!el) return;
  el.textContent = m;
  el.className = 'ts on' + (e ? ' e' : '');
  clearTimeout(tmr);
  tmr = setTimeout(function(){ el.className = 'ts'; }, 2600);
}
function nid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
var MS = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function fdt(d){
  return String(d.getDate()).padStart(2,'0') + ' ' + MS[d.getMonth()] + ' ' + d.getFullYear();
}
function fhr(d){
  return new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d);
}
function fcpf(v){
  var n = String(v).replace(/\D/g,'').slice(0,14);
  if(n.length <= 3) return n;
  if(n.length <= 6) return n.replace(/(\d{3})(\d+)/,'$1.$2');
  if(n.length <= 9) return n.replace(/(\d{3})(\d{3})(\d+)/,'$1.$2.$3');
  if(n.length <= 11) return n.replace(/(\d{3})(\d{3})(\d{3})(\d+)/,'$1.$2.$3-$4');
  if(n.length <= 12) return n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})/,'$1.$2.$3/$4');
  return n.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d+)/,'$1.$2.$3/$4-$5');
}
function auth(){
  var h = '0123456789abcdef', s = '', i;
  for(i=0;i<8;i++) s += h[Math.floor(Math.random()*16)];
  s += '-';
  for(i=0;i<4;i++) s += h[Math.floor(Math.random()*16)];
  s += '-';
  for(i=0;i<4;i++) s += h[Math.floor(Math.random()*16)];
  s += '-';
  for(i=0;i<4;i++) s += h[Math.floor(Math.random()*16)];
  s += '-';
  for(i=0;i<12;i++) s += h[Math.floor(Math.random()*16)];
  return s;
}
function rCardN(){
  var prefixes = ['5412','5275','4539','4916','5447','4024'];
  var p = prefixes[Math.floor(Math.random()*prefixes.length)];
  var nums = p + ' ';
  for(var i=0;i<3;i++){
    var blk = '';
    for(var j=0;j<4;j++) blk += Math.floor(Math.random()*10);
    nums += blk + (i<2 ? ' ' : '');
  }
  return nums;
}
function rCardE(){
  var m = String(Math.floor(Math.random()*12)+1).padStart(2,'0');
  var a = String(new Date().getFullYear() + Math.floor(Math.random()*4) + 2).slice(-2);
  return m + '/' + a;
}

/* ============ QR CODE ============ */
function scanQR(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    tst('Câmera não disponível', 1);
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(st){
      var v = document.createElement('video');
      v.srcObject = st;
      v.setAttribute('playsinline','');
      v.setAttribute('muted','');
      v.play();
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center';
      v.style.cssText = 'width:100%;height:100%;object-fit:cover';
      var bt = document.createElement('button');
      bt.textContent = 'X Fechar';
      bt.style.cssText = 'position:absolute;top:20px;right:20px;background:#fff;color:#111;padding:12px 18px;border-radius:10px;font-weight:700;z-index:2;border:0;cursor:pointer;font-size:14px';
      bt.onclick = function(){
        st.getTracks().forEach(function(t){ t.stop(); });
        if(ov.parentNode) document.body.removeChild(ov);
        go('pix');
      };
      var moldura = document.createElement('div');
      moldura.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;height:240px;border:3px solid #fff;border-radius:20px;box-shadow:0 0 0 4000px rgba(0,0,0,.5);pointer-events:none;z-index:1';
      var hint = document.createElement('div');
      hint.textContent = 'Aponte para um QR Code';
      hint.style.cssText = 'position:absolute;bottom:40px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;font-weight:600;background:rgba(0,0,0,.6);padding:10px 18px;border-radius:20px;z-index:2';
      ov.appendChild(v);
      ov.appendChild(moldura);
      ov.appendChild(bt);
      ov.appendChild(hint);
      document.body.appendChild(ov);

      var done = false;
      if('BarcodeDetector' in window){
        try{
          var det = new window.BarcodeDetector({ formats: ['qr_code'] });
          var loop = function(){
            if(done) return;
            det.detect(v).then(function(codes){
              if(codes && codes.length){
                done = true;
                processarQR(codes[0].rawValue);
                st.getTracks().forEach(function(t){ t.stop(); });
                if(ov.parentNode) document.body.removeChild(ov);
              } else {
                setTimeout(loop, 500);
              }
            }).catch(function(){ setTimeout(loop, 800); });
          };
          loop();
        }catch(e){
          setTimeout(function(){
            if(done) return;
            done = true;
            st.getTracks().forEach(function(t){ t.stop(); });
            if(ov.parentNode) document.body.removeChild(ov);
            processarQR(JSON.stringify({ name: 'Maria Silva', key: 'maria@email.com', institution: 'Nubank' }));
          }, 3500);
        }
      } else {
        setTimeout(function(){
          if(done) return;
          done = true;
          st.getTracks().forEach(function(t){ t.stop(); });
          if(ov.parentNode) document.body.removeChild(ov);
          processarQR(JSON.stringify({ name: 'Maria Silva', key: 'maria@email.com', institution: 'Nubank' }));
        }, 3500);
      }
    })
    .catch(function(){ tst('Não foi possível acessar a câmera', 1); });
}

function processarQR(raw){
  var n = '', k = '', i = 'Nubank';
  try{
    var o = JSON.parse(raw);
    n = o.name || o.nome || '';
    k = o.key || o.chave || o.pix || '';
    i = o.institution || o.banco || 'Nubank';
  }catch(e){
    n = String(raw).slice(0, 60);
    k = String(raw).slice(0, 100);
  }
  if(!n && !k){ tst('QR Code não reconhecido', 1); return; }
  go('pix');
  $id('pName').value = n;
  $id('pKey').value = k;
  $id('pInst').value = i;
  tst('QR lido! Complete o valor do Pix');
  setTimeout(function(){ $id('pVal').focus(); }, 400);
}

/* ============ RENDIMENTO DIÁRIO ============ */
function aplicarRendimento(){
  var hoje = new Date().toISOString().slice(0,10);
  if(S.lastRend === hoje) return;
  if(S.inv1 > 0 || S.inv2 > 0){
    var tx1 = Math.pow(1 + 0.015, 1/30) - 1;
    var tx2 = Math.pow(1 + 0.019, 1/30) - 1;
    var r1 = Math.round(S.inv1 * tx1 * 100) / 100;
    var r2 = Math.round(S.inv2 * tx2 * 100) / 100;
    var total = Math.round((r1 + r2) * 100) / 100;
    if(total > 0){
      S.inv1 = Math.round((S.inv1 + r1) * 100) / 100;
      S.inv2 = Math.round((S.inv2 + r2) * 100) / 100;
    }
  }
  S.lastRend = hoje;
  salvar();
}
